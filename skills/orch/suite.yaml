# Plugin metadata for the orch suite. The only hand-edited plugin file:
# scripts/render-plugins.sh writes .claude-plugin/plugin.json here and both
# marketplace indexes at the repo root from it. Bump version when the suite's
# behavior changes.
name: skill-suites-orch
displayName: orch
version: 2.0.0
description: Plans which of your installed skills to run for a problem, in what order and with what backups, then runs the plan with check-ins where you decide.
