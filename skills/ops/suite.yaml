# Plugin metadata for the ops suite. The only hand-edited plugin file:
# scripts/render-plugins.sh writes .claude-plugin/plugin.json here and both
# marketplace indexes at the repo root from it. Bump version when the suite's
# behavior changes.
name: skill-suites-ops
displayName: ops
version: 1.0.1
description: Turns a pile of installed skills into a plan that picks which to run and in what order, runs them with backups and check-ins, and remembers which sequences worked.
keywords:
  - skill-suites
  - ops-plan
  - ops-recon
  - ops-order
  - ops-run
  - ops-assess
  - ops-learn
category: development
author:
  name: Robin Cannon
  url: https://github.com/shinytoyrobots
homepage: https://github.com/shinytoyrobots/skill-suites
repository: https://github.com/shinytoyrobots/skill-suites
license: Apache-2.0
# Optional: a square PNG inside the suite, shown by Claude Code and Grok. Keep it small.
icon: ./assets/icon.png
